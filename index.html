<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
<title>grovy</title>
<link rel="icon" type="image/png" href="/assets/icon-64.png">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root { --bg:#f7f6f3; --fg:#1d1d1b; --mut:#77756e; --faint:#a9a69e; --card:#fff; --line:#e4e2dc;
  --acc:#c96442; --user:#dfe8fb; --code:#efede7; --ok:#2f8a4c; --warn:#c27c0e; --bad:#c2402f; --busy:#3a6fd8;
  /* for themes (⋯ → Theme): the titles' font, a texture under the page, the backdrop tree's colour and strength */
  --sans:-apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --title-font:inherit; --grain:none; --tree:var(--faint); --tree-opacity:.22; }
@media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ebe9e4; --mut:#9c998f; --faint:#64625c;
  --card:#21211f; --line:#33322f; --acc:#e08a67; --user:#25365c; --code:#252523; --ok:#5cc47e; --warn:#f0a63a;
  --bad:#f0705f; --busy:#7aa2ff; --tree:var(--mut); } }   /* --faint barely shows on a dark page */
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; background-color:var(--bg); background-image:var(--grain); color:var(--fg);
  font:16px/1.5 var(--sans); }
body { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
button { font:inherit; color:inherit; cursor:pointer; }
/* tap targets aren't text: only what you'd copy or quote is selectable (long-pressing a card mustn't start a selection) */
body { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
.u, .a, .err, .perm pre, .diff, .path, .rc, .q .qt, .wg, .link, .hit .s, .kv2 span:last-child, input, textarea, #input, .field {
  -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }
button, .u .st, .wg .lf { -webkit-user-select:none; user-select:none; }
#quotesel { display:block; width:100%; margin:0 0 8px; min-height:42px; border-radius:12px; border:1px solid var(--busy);
  background:color-mix(in srgb, var(--busy) 12%, var(--card)); color:var(--busy); font-weight:650; animation:fadein .15s ease-out; }
.hidden { display:none !important; }

/* header */
header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:8px;
  padding:3px 10px; padding-top:calc(3px + env(safe-area-inset-top)); background-color:var(--bg); background-image:var(--grain);
  border-bottom:1px solid var(--line); min-height:46px; }
#back { border:0; background:none; font-size:26px; line-height:1; padding:2px 8px 4px 2px; min-height:40px; }
header h1 { font-size:17px; margin:0; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pill { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; padding:3px 10px;
  border-radius:99px; background:var(--card); border:1px solid var(--line); white-space:nowrap; }
/* A session's name and its status pill share one line: each starts at its own width and gives way when it can't
   fit, but the name always keeps a few letters (the pill's text is cut instead) */
header h1 { flex:1 1 auto; min-width:min(4.5em, 34vw); }
#pill { flex:0 1 auto; min-width:0; }
#ptext { overflow:hidden; text-overflow:ellipsis; min-width:0; }
.kv2 { display:flex; justify-content:space-between; gap:12px; padding:11px 2px; border-bottom:1px solid var(--line); }
.kv2 span:first-child { color:var(--mut); }
#live { font-size:12px; font-weight:600; color:var(--warn); white-space:nowrap; flex:none; }
#live.on { display:none; }

/* state dots */
.dot { width:10px; height:10px; border-radius:50%; flex:none; background:var(--faint); }
.dot.idle { background:var(--ok); } .dot.error { background:var(--bad); }
.dot.working, .dot.starting { background:var(--busy); animation:breathe 2s ease-in-out infinite; }
.dot.needs_input { background:var(--warn); animation:breathe .9s ease-in-out infinite; }
.dot.unknown { background:none; box-shadow:inset 0 0 0 2px var(--faint); } .dot.exited { background:var(--faint); }
.dot.stalled { background:var(--busy); opacity:.45; animation:none; }   /* still working, just quiet (long tool) */
@keyframes breathe { 0%,100% { transform:scale(1); opacity:1 } 50% { transform:scale(.6); opacity:.45 } }

/* session list */
main { flex:1; width:100%; max-width:760px; margin:0 auto; padding:6px 14px 12px; }
.sess { display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; border:0; background:none;
  padding:14px 4px; border-bottom:1px solid var(--line); }
.sess .dot { margin-top:7px; }
.sess .body { flex:1; min-width:0; }
.sess .top { display:flex; gap:8px; align-items:center; }   /* pills stay centred on the name, whatever its font */
.sess .name { font-weight:650; font-size:17px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sess .when { font-size:13px; color:var(--mut); flex:none; }
.sess .sub { font-size:13px; color:var(--mut); }
.sess .prev { font-size:15px; margin-top:2px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2;
  -webkit-box-orient:vertical; overflow-wrap:anywhere; }
.sess .rm { align-self:center; flex:none; font-size:13px; font-weight:600; color:var(--bad); border:1px solid var(--line);
  border-radius:99px; padding:6px 12px; background:var(--card); }
.mach { font-size:11px; font-weight:650; color:var(--mut); border:1px solid var(--line); border-radius:6px; padding:0 5px;
  margin-right:6px; vertical-align:middle; font-family:var(--sans); letter-spacing:0; }
.machines { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 12px; }
.machines .btn.sel { outline:2px solid var(--acc); }
.sess .badge { font-size:12px; font-weight:700; color:#fff; background:var(--warn); border-radius:99px; padding:1px 8px; }
.sess.nested { padding-left:22px; border-left:2px solid var(--line); }   /* a worktree, nested under its root project */
.empty { text-align:center; color:var(--mut); padding:48px 10px; }
/* the grove backdrop (from grove, the same author's tmux agent manager), only on the session list */
#backdrop { display:none; position:fixed; right:-6vw; bottom:0; height:min(72vh, 640px); aspect-ratio:941/1672;
  background:var(--tree); opacity:var(--tree-opacity); pointer-events:none; z-index:0;
  -webkit-mask:url(/assets/backdrop.svg) center bottom / contain no-repeat; mask:url(/assets/backdrop.svg) center bottom / contain no-repeat; }
body.home #backdrop { display:block; }
#main { position:relative; z-index:1; }

body.home #logo { display:block; }
header h1, .sess .name, #sheet h2, #side .sh a, .md :is(h1, h2, h3, h4), .wt, .sect { font-family:var(--title-font); }

/* conversation */
.u { margin:18px 0 6px auto; max-width:86%; width:fit-content; background:var(--user); padding:9px 13px;
  border-radius:18px 18px 4px 18px; white-space:pre-wrap; overflow-wrap:anywhere; }
.u .st { display:block; font-size:12px; color:var(--mut); margin-top:3px; text-align:left; }
.u .st.bad { color:var(--bad); } .u .st.warn { color:var(--warn); } .tk { display:inline-flex; margin-right:5px; font-size:14px; font-weight:600; }
.tk i { font-style:normal; display:inline-block; transform:scaleY(.75); } .tk i+i { margin-left:-.45em; } .tk.rd { color:var(--busy); } .u .tm { margin-right:4px; }
.u.pending { opacity:.75; }
.u { display:flow-root; }
.u .st.in { float:right; margin:7px -3px -6px 14px; }   /* on the last line when it fits, as in WhatsApp */
.uq b { display:block; font-size:12.5px; color:var(--busy); } .uq.claude, .uq.you { cursor:pointer; }
.found { animation:found 1.6s ease-out; }
@keyframes found { from { box-shadow:0 0 0 4px color-mix(in srgb, var(--busy) 45%, transparent); } to { box-shadow:0 0 0 4px transparent; } }
.attimg { display:block; width:fit-content; margin:4px 0; } .attimg img { display:block; max-width:100%; max-height:260px; border-radius:12px; }
.attc img { width:22px; height:22px; object-fit:cover; border-radius:5px; margin-right:4px; flex:none; }
.acts .ar { margin-left:auto; display:flex; gap:2px; }
.acts { display:flex; flex-wrap:wrap; gap:2px; margin:2px -8px 0 -8px; -webkit-user-select:none; user-select:none; }
.acts button { border:0; background:none; color:var(--mut); font-size:13px; font-weight:600; padding:6px 8px; min-height:34px; border-radius:8px; }
.acts button:active { background:var(--code); }
.acts .wkb { font-weight:400; } span.wkb { font-size:13px; color:var(--mut); padding:6px 8px; align-self:center; }
.wkb.more-t::after { content:" ›"; } .wkb.more-t[aria-expanded="true"]::after { content:" ⌄"; }
.wkl { margin:4px 0 0; padding-left:1.6em; font:12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color:var(--mut);
  overflow-wrap:anywhere; } .wkl li b { font-weight:650; color:var(--fg); } .wkl .wn { list-style:none; font-family:inherit; }
.uq { display:block; border-left:3px solid var(--busy); padding:1px 0 1px 9px; margin:2px 0 6px; color:var(--mut); font-size:14.5px; }
.u button.link { border:0; background:none; color:var(--acc); padding:0 0 0 6px; font-size:12px; }
.a { margin:6px 0 4px; overflow-wrap:anywhere; }
.a.collapsed .md { max-height:22em; overflow:hidden; -webkit-mask-image:linear-gradient(#000 70%, transparent); }
.agent { border:1px solid var(--line); border-left:3px solid var(--mut); border-radius:10px; padding:8px 12px; margin:14px 0; }
.agent .ah { font-size:13px; font-weight:650; color:var(--mut); margin-bottom:4px; }
.agent.collapsed .a { max-height:7.5em; overflow:hidden; -webkit-mask-image:linear-gradient(#000 40%, transparent); }
.more { border:0; background:none; color:var(--acc); font-weight:600; padding:6px 0; min-height:36px; }
.sys { text-align:center; font-size:12.5px; color:var(--mut); margin:10px 0; }
.sys span { padding:0 8px; }
.err { border:1px solid var(--bad); color:var(--bad); border-radius:12px; padding:10px 12px; margin:10px 0;
  white-space:pre-wrap; }

/* markdown */
.md > :first-child { margin-top:0 } .md > :last-child { margin-bottom:0 }
.md p { margin:0 0 .7em; }
.md h1, .md h2, .md h3, .md h4 { margin:1.1em 0 .4em; line-height:1.3; }
.md h1 { font-size:1.25em } .md h2 { font-size:1.15em } .md h3, .md h4 { font-size:1.03em }
.md ul, .md ol { margin:0 0 .7em; padding-left:1.4em; } .md li { margin:.2em 0; }
.md li > ul, .md li > ol { margin:.2em 0 0; }
.md blockquote { margin:0 0 .7em; padding:2px 0 2px 12px; border-left:3px solid var(--line); color:var(--mut); }
.md hr { border:0; border-top:1px solid var(--line); margin:1em 0; }
.md a { color:var(--acc); }
.md code { font:.88em/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background:var(--code);
  padding:.1em .35em; border-radius:5px; }
.cb { position:relative; margin:0 0 .8em; }
.cb pre { margin:0; padding:12px; padding-right:52px; background:var(--code); border-radius:10px; overflow-x:auto;
  font:13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
.cb pre code { background:none; padding:0; font-size:inherit; }
.cb .copy { position:absolute; top:6px; right:6px; border:1px solid var(--line); background:var(--card);
  border-radius:8px; font-size:12px; padding:5px 9px; min-height:32px; }
.tw { overflow-x:auto; margin:0 0 .8em; }
.mathb { overflow-x:auto; overflow-y:hidden; margin:0 0 .7em; padding:2px 0; white-space:pre-wrap; }
.md math[display="block"] { overflow-x:auto; overflow-y:hidden; max-width:100%; }
.tw table { border-collapse:collapse; font-size:14px; }
.tw th, .tw td { border-bottom:1px solid var(--line); padding:6px 10px 6px 0; text-align:left; vertical-align:top; }
.rc { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:0 0 8px; }
.rc .t { font-weight:650; margin-bottom:4px; }
.rc .kv { font-size:14.5px; margin:3px 0; } .rc .k { color:var(--mut); }

/* typing indicator (lives outside the re-rendered list so its animation never restarts) */
#typing { max-width:760px; margin:0 auto; width:100%; padding:2px 14px 10px; display:flex; align-items:center; gap:10px; }
.dots { display:inline-flex; align-items:center; height:30px; padding:0 4px; }   /* one ink dot, breathing slowly */
.dots i { width:9px; height:9px; border-radius:50%; background:var(--busy); animation:breathe 2.8s ease-in-out infinite; }
#typing.stalled .dots i { background:var(--faint); animation-duration:4.5s; }
.tool { font:12.5px ui-monospace, SFMono-Regular, Menlo, monospace; background:var(--code); border-radius:7px;
  padding:3px 8px; max-width:45vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tool.fade { animation:fadein .45s ease-out; }
.says { flex:1; min-width:0; font-size:13px; color:var(--mut); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* a turn's steps (what Claude wrote between tool calls, and the calls): dimmed, above its answer */
.stp { margin:2px 0; padding-left:10px; border-left:2px solid var(--line); color:var(--mut); font-size:14px; overflow-wrap:anywhere; }
.stp .md p { margin:4px 0; } .stp + .a, .stp + .wg { margin-top:10px; }
.stp.t { font:12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stp.t b { font-weight:650; color:var(--fg); }
#steps { display:flex; align-items:center; justify-content:center; color:var(--mut); }
#steps[aria-pressed="true"] { color:var(--fg); background:var(--code); border-radius:10px; }
@keyframes fadein { from { opacity:0; transform:translateY(3px) } to { opacity:1; transform:none } }
.elapsed { font-size:13px; color:var(--mut); font-variant-numeric:tabular-nums; }

/* permission card */
.perm { border:2px solid var(--warn); border-radius:14px; padding:12px; margin:14px 0; background:var(--card);
  animation:slideup .35s ease-out; }
@keyframes slideup { from { opacity:0; transform:translateY(16px) } to { opacity:1; transform:none } }
.perm .h { font-weight:650; margin-bottom:6px; } .perm .note { font-size:13px; color:var(--mut); margin-top:6px; }
.perm pre { margin:6px 0 0; padding:10px; background:var(--code); border-radius:8px; white-space:pre-wrap;
  overflow-wrap:anywhere; font:13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; max-height:45vh; overflow:auto; }
.row { display:flex; gap:10px; margin-top:12px; }
.btn { flex:1; min-height:48px; border-radius:12px; border:1px solid var(--line); background:var(--card); font-weight:650; }
.btn.allow { background:var(--ok); border-color:var(--ok); color:#fff; }
.btn.deny { color:var(--bad); border-color:var(--bad); }
.btn:disabled { opacity:.45; }

#err { position:fixed; left:12px; right:12px; top:calc(54px + env(safe-area-inset-top)); z-index:30; background:var(--bad);
  color:#fff; border-radius:10px; padding:10px 12px; font-size:14px; }
/* bottom sheet (switcher, menu, new session, search) */
#sheet { position:fixed; inset:0; z-index:40; display:flex; align-items:flex-end; background:rgba(0,0,0,.35);
  animation:fadebg .2s ease-out; }
#sheet .panel { width:100%; max-width:760px; margin:0 auto; max-height:85vh; overflow-y:auto; background-color:var(--bg); background-image:var(--grain);
  border-radius:18px 18px 0 0; padding:8px 16px calc(16px + env(safe-area-inset-bottom)); animation:slideup .25s ease-out; }
#sheet .grab { width:40px; height:4px; border-radius:2px; background:var(--line); margin:4px auto 12px; }
#sheet h2 { font-size:17px; margin:4px 0 12px; }
@keyframes fadebg { from { background:rgba(0,0,0,0) } }
#sclose { display:none; }
/* a wide screen: a centred dialog with a close button, its body scrolling under it */
@media (min-width: 1000px) {
  #sheet { align-items:center; justify-content:center; padding:24px; }
  #sheet .panel { position:relative; display:flex; flex-direction:column; width:min(600px, 100%); max-height:min(80vh, 760px);
    overflow:hidden; padding:0; border-radius:14px; border:1px solid var(--line); box-shadow:0 18px 50px rgba(0,0,0,.28);
    animation:popin .16s ease-out; }
  #sheet .grab { display:none; }
  #sheetbody { overflow-y:auto; min-height:0; padding:16px 20px 20px; }
  #sheet h2 { margin:0 40px 14px 0; font-size:18px; }
  #sclose { display:grid; place-items:center; position:absolute; top:10px; right:10px; z-index:1; width:32px; height:32px;
    border:0; border-radius:8px; background:none; color:var(--mut); font-size:16px; }
  #sclose:hover { background:var(--code); color:var(--fg); }
  #sheet .item { min-height:44px; padding:10px 8px; margin:0 -8px; width:calc(100% + 16px); border-radius:8px; border-bottom-color:transparent; }
  #sheet .item:hover:not([disabled]) { background:var(--code); }
  #sheet .sect { padding:0; }
}
@keyframes popin { from { opacity:0; transform:scale(.97) } to { opacity:1; transform:none } }
.item { display:flex; align-items:center; gap:12px; width:100%; text-align:left; border:0; background:none;
  padding:12px 4px; min-height:52px; border-bottom:1px solid var(--line); font-size:16px; }
.item.danger { color:var(--bad); } .item .sub { font-size:13px; color:var(--mut); }
.item.cur { font-weight:700; }
.field { display:block; width:100%; font:inherit; font-size:16px; padding:11px 14px; border-radius:12px;
  border:1px solid var(--line); background:var(--card); color:var(--fg); margin:0 0 12px; }
.lbl { font-size:13px; color:var(--mut); margin:0 0 6px; }
.sect { font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--mut); font-weight:600; margin:16px 0 4px; padding:0 4px; }
.sect.first { margin-top:4px; }
.folders { max-height:38vh; overflow-y:auto; border:1px solid var(--line); border-radius:12px; margin-bottom:12px; }
.folders .item { padding:10px 12px; min-height:48px; }
.folders .item.sel { background:color-mix(in srgb, var(--busy) 12%, var(--bg)); font-weight:650; }
.toggle { display:flex; align-items:center; gap:10px; margin:0 0 14px; font-size:15px; }
.toggle input { width:22px; height:22px; }
.toggle.ext { align-items:flex-start; } .toggle.ext input { flex:none; margin-top:1px; }
.toggle.ext .sub { color:var(--mut); font-size:13px; }
.hit { border:1px solid var(--line); background:var(--card); border-radius:12px; padding:10px 12px; margin:0 0 8px;
  width:100%; text-align:left; }
.hit .w { font-size:12px; color:var(--mut); } .hit .s { overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }
mark { background:color-mix(in srgb, var(--warn) 35%, transparent); color:inherit; border-radius:3px; }
#title.tap { cursor:pointer; } #title.tap::after { content:" ▾"; font-size:13px; color:var(--mut); }
.hbtn { border:0; background:none; font-size:22px; line-height:1; min-width:40px; min-height:40px; padding:0 6px; color:var(--fg); }
.earlier { display:block; margin:6px auto 10px; border:1px solid var(--line); background:var(--card); border-radius:99px;
  padding:6px 16px; font-size:14px; min-height:36px; }
#quick { display:flex; gap:8px; margin:0 0 8px; flex-wrap:wrap; }
#quick:empty { display:none; }
#quick.hold { visibility:hidden; }   /* typing: the chips go, their space stays, so nothing above jumps */
.chip { border:1px solid var(--line); background:var(--card); border-radius:99px; padding:8px 16px; min-height:40px; font-weight:600; }
.resume { width:100%; min-height:48px; border-radius:12px; border:0; background:var(--acc); color:#fff; font-weight:650; }

/* readable tool input on permission cards */
.diff { margin:6px 0 0; border-radius:8px; overflow:hidden; font:13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
.diff div { white-space:pre-wrap; overflow-wrap:anywhere; padding:0 8px; }
.diff .del { background:color-mix(in srgb, var(--bad) 16%, transparent); }
.diff .add { background:color-mix(in srgb, var(--ok) 18%, transparent); }
.diff .del::before { content:"− "; color:var(--bad); } .diff .add::before { content:"+ "; color:var(--ok); }
.path { font:13px ui-monospace, SFMono-Regular, Menlo, monospace; color:var(--mut); overflow-wrap:anywhere; margin-top:2px; }

.warnline { color:var(--warn); font-size:14px; margin:0 0 12px; }
.errline { color:var(--bad); font-size:14px; font-weight:600; margin:6px 0 10px; }
/* question card */
.q { border:2px solid var(--busy); }
.q .qh { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--busy); margin-top:4px; }
.q .qt { font-weight:650; margin:2px 0 8px; }
.opt { display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--bg); border-radius:12px;
  padding:10px 12px; margin:0 0 8px; min-height:48px; }
.opt .d { display:block; font-size:13px; color:var(--mut); margin-top:2px; }
.opt.sel { border-color:var(--busy); background:color-mix(in srgb, var(--busy) 12%, var(--bg)); }
.opt.sel::before { content:"✓ "; color:var(--busy); font-weight:700; }
.q textarea { width:100%; min-height:44px; border-radius:12px; margin-bottom:4px; }
.q + .q, .qs + .qs { margin-top:14px; }

/* composer */
#composer { position:sticky; bottom:0; z-index:4; background-color:var(--bg); background-image:var(--grain); border-top:1px solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom)); }
/* shown when scrolled away from the latest message; the dot means something new arrived meanwhile */
#tobottom { position:absolute; right:14px; top:-58px; width:44px; height:44px; border-radius:50%; border:1px solid var(--line);
  background:var(--card); color:var(--mut); box-shadow:0 2px 10px rgba(0,0,0,.18); display:grid; place-items:center; padding:0;
  animation:fadein .15s ease-out; } #tobottom svg { width:22px; height:22px; }
#tobottom.new::after { content:""; position:absolute; top:1px; right:1px; width:11px; height:11px; border-radius:50%;
  background:var(--acc); border:2px solid var(--card); }
#composer .inner { max-width:760px; margin:0 auto; }
#hint { font-size:12.5px; color:var(--mut); margin:0 4px 6px; }
/* background work (shells, subagents) still running after Claude's turn ended */
#bg { margin:0 0 6px; font-size:13px; color:var(--mut); }
#bg:empty { display:none; }
#bg > button { display:flex; align-items:center; gap:8px; width:100%; border:0; background:none; color:inherit; font:inherit;
  text-align:left; padding:4px; min-height:32px; }
#bg > button span:nth-child(2) { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#bg > button b { color:var(--fg); font-weight:650; }
.spin { width:9px; height:9px; flex:none; border-radius:50%; background:var(--busy); animation:breathe 2s ease-in-out infinite; }
#bg ul { list-style:none; margin:2px 0 4px; padding:0 4px; max-height:38vh; overflow-y:auto; }
#bg li { padding:6px 0; border-top:1px solid var(--line); }
#bg li .t { display:flex; gap:8px; align-items:baseline; } #bg li .t b { color:var(--fg); font-weight:650; flex:1; min-width:0;
  overflow-wrap:anywhere; } #bg .el { font-variant-numeric:tabular-nums; flex:none; }
#bg li .d { font:12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap:anywhere; margin-top:2px; }
/* background work: its own small blue mark beside the state, never mixed into the state dot */
.run { color:var(--busy); font-weight:600; white-space:nowrap; }
.run i { display:inline-block; width:7px; height:7px; margin-right:4px; vertical-align:.1em; border-radius:50%; background:var(--busy);
  animation:breathe 2s ease-in-out infinite; }
.srow .run { font-size:12px; }
#hint:empty { display:none; }
.cr { display:flex; gap:8px; align-items:flex-end; }
textarea, #input { flex:1; font:inherit; font-size:16px; padding:11px 14px; border-radius:22px; border:1px solid var(--line);
  background:var(--card); color:var(--fg); min-height:46px; max-height:40vh; resize:none; outline:none; }
textarea:focus, #input:focus { border-color:var(--mut); }
/* the message box: markdown shown as you type, the markers kept (richBox) */
#input { overflow-y:auto; white-space:pre-wrap; overflow-wrap:anywhere; cursor:text; line-height:1.4; }
#input:empty::before { content:attr(data-placeholder); content:attr(data-placeholder) / ""; color:var(--mut); pointer-events:none; }
#input .rt-mk { color:var(--mut); } #input .rt-b, #input .rt-h { font-weight:700; } #input .rt-i { font-style:italic; }
#input .rt-s { text-decoration:line-through; } #input .rt-q { color:var(--mut); } #input .rt-l { color:var(--acc); }
#input :is(.rt-c, .rt-cb) { font:.88em/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background:var(--code); border-radius:4px; }
#send { width:46px; height:46px; border-radius:50%; border:0; background:var(--acc); color:#fff; flex:none;
  display:grid; place-items:center; }
#send:disabled { opacity:.35; }
.tbox { position:relative; flex:1; display:flex; min-width:0; } .tbox #input { padding-right:46px; }
/* in the text box: the paperclip while it's empty (files go before the words), then a cross to clear it */
.tbtn { position:absolute; right:3px; bottom:3px; width:40px; height:40px; border:0; border-radius:50%; background:none;
  color:var(--mut); display:grid; place-items:center; padding:0; } .tbtn svg { width:21px; height:21px; }
.tbtn:active { background:var(--code); }
#expand .shut, #composer.full #expand .open { display:none; } #composer.full #expand .shut { display:inline; }
.tbtn.top { top:3px; bottom:auto; }
/* a long message: the box takes the whole screen (the keyboard shrinks it: interactive-widget=resizes-content) */
#composer.full { position:fixed; inset:0; z-index:20; display:flex; border-top:0;
  padding:calc(8px + env(safe-area-inset-top)) 12px calc(8px + env(safe-area-inset-bottom)); }
#composer.full .inner { flex:1; min-height:0; width:100%; display:flex; flex-direction:column; }
#composer.full :is(#bg, #quick, #quotesel, #tobottom, #slot-composer) { display:none; }
#composer.full #hint { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }   /* one line: "Sending will ask first"… */
#composer.full #atts { flex:none; max-height:25%; overflow-y:auto; }   /* many files can't squeeze the text away */
/* the text runs edge to edge, no frame; its buttons float: ⤡ and ✕ in the top corner, send at the bottom */
#composer.full .cr { flex:1; min-height:0; align-items:stretch; position:relative; }
#composer.full #input { height:auto !important; max-height:none; border:0; border-radius:0; background:none;
  padding:2px 2px 72px; }
#composer.full .tbox { padding-top:44px; }   /* the title row: the text scrolls below it, never under it */
#composer.full #clear { top:3px; bottom:auto; right:46px; }
#fhead { display:none; } /* the full-screen box's title, on the line of its buttons */
#composer.full #fhead { display:block; position:absolute; top:3px; left:2px; right:92px; line-height:40px; font-size:15px;
  font-weight:650; color:var(--mut); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; pointer-events:none; }
#composer.full #send { position:absolute; right:4px; bottom:4px; box-shadow:0 2px 10px rgba(0,0,0,.25); }
body.fulledit { overflow:hidden; }
#atts { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 8px; } #atts:empty { display:none; }
.attc { display:inline-flex; align-items:center; gap:2px; max-width:100%; font-size:13px; background:var(--card);
  border:1px solid var(--line); border-radius:99px; padding:2px 2px 2px 10px; }
.attc span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .attc.busy { opacity:.6; padding-right:10px; }
.attc button { border:0; background:none; color:var(--mut); min-width:30px; min-height:30px; flex:none; }
.attl { display:flex; width:fit-content; max-width:100%; margin:4px 0; font-size:13.5px; padding:3px 10px; border-radius:8px;
  background:color-mix(in srgb, var(--fg) 7%, transparent); overflow-wrap:anywhere; }
/* one button, three jobs: send; steer (Claude is working and you typed something: blue, it gets it at its next step);
   stop (Claude is working and the box is empty: interrupt, after a confirm) */
#send .sq { display:none; width:14px; height:14px; border-radius:3px; background:currentColor; }
#send.steer { background:var(--busy); }
#send.stop { background:var(--card); border:1px solid var(--line); color:var(--bad); }
#send.stop svg { display:none; } #send.stop .sq { display:block; }
#picker { display:flex; flex-direction:column; gap:2px; margin:0 0 8px; max-height:40vh; overflow-y:auto; }
#picker:empty { display:none; }
.cmd { flex:none; text-align:left; border:0; background:var(--card); border-radius:10px; padding:8px 12px; min-height:44px; }
.cmd b { font:600 14px ui-monospace, SFMono-Regular, Menlo, monospace; } .cmd span { display:block; font-size:12.5px; color:var(--mut); }
#send svg { width:20px; height:20px; }
/* pages: Claude-made HTML, shown full-screen in a sandboxed frame */
#viewer { position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; background-color:var(--bg); background-image:var(--grain); }
#viewer .vh { display:flex; align-items:center; gap:10px; padding:8px 12px; padding-top:calc(8px + env(safe-area-inset-top));
  border-bottom:1px solid var(--line); min-height:52px; }

<script>

// Map of this script (each part starts with a "// ----" line):
//   basics       h() builds DOM (never innerHTML), time/text helpers, api()
//   markdown     Claude's replies, rendered as a safe subset
//   widgets      ```widget blocks: the frame and checks; the renderers are extensions/widgets.js
//   session list the home screen
//   conversation one session: messages, tool calls, permission cards, the context bar, background work
//   composer     the message box: send / steer / stop, slash commands, attachments, quoting a selection
//   sheets       dialogs and menus: ask(), say(), the ⋯ menu, rename, search, new session
//   pages        the full-screen page viewer and sharing
//   sidebar      wide screens: sessions and pages beside the conversation
//   keyboard     shortcuts and focus

//   extensions   window.grovy: all that extensions/*.js and ~/.config/grovy/custom.js use (see examples/custom.js)

let pages = {}, viewing = null;
const pageOf = id => pages[id] || sidePages[id];   // the viewer may show another session's page (opened from the sidebar)   // this session's published pages; the one open in the viewer: {id, version}
const cache = new Map();   // rendered nodes by key: keeps "show more" state and avoids re-render churn

function h(tag, attrs, ...kids) {           // never uses innerHTML: all text is inserted as text
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k === "ctx") e._ctx = v;   // its right-click items (see "context menu")

const machineOf = n => { const i = String(n || "").indexOf(":"); return i > 0 ? n.slice(0, i) : null; };

// cached card (a pending question) would replay its entrance on every refresh.

  const key = had && had.getAttribute("data-fk");

  kids.forEach((k, i) => { if (box.childNodes[i] !== k) box.insertBefore(k, box.childNodes[i] || null); });
  if (!had) return;

  if (!r.ok) throw new Error(j.error || r.statusText);

// ---------------------------------------------------------------- markdown (subset, DOM-built, no HTML)
function inline(text) {

    else if (m[5] || m[6]) out.push(h("em", {}, inline(m[5] || m[6])));
    else if (m[7]) out.push(h("s", {}, inline(m[7])));
    else if (m[8]) out.push(h("a", {href: m[9], target: "_blank", rel: "noopener noreferrer"}, inline(m[8])));
    else if (m[10]) out.push(h("a", {href: m[10], target: "_blank", rel: "noopener noreferrer"}, m[10]));

    last = re.lastIndex;

}
let MATH = null;   // render(tex, display) -> a node, from grovy.math (the built-in one: extensions/math.js)
function math(tex, display, src) {   // src: the math as written, shown as it is when it can't be drawn
  if (!MATH) return src;
  try { return MATH(tex, display); }
  catch (e) { return h("code", {class: "mathx", title: "Not drawn: " + (e && e.message || e)}, src); }

function md(src, opts = {}) {   // opts.widgets === false: ```widget stays code (the user's own messages)

// ---------------------------------------------------------------- session list
// An issue's session lives in a git worktree of a project; show it indented, right below that project's own
// session (keeping each session's sorted order). A worktree whose root project has no session falls to the end.
function orderSessions(sessions) {
  const kids = {};   // root path -> its worktree sessions
  const at = (s, path) => (s.machine || "") + "\0" + path;   // the same folder on two machines isn't one project
  for (const s of sessions) if (s.issue) (kids[at(s, s.issue.root)] ||= []).push(s);
  const out = [];
  for (const s of sessions) {
    if (s.issue) continue;                             // placed under its root below, not at top level
    out.push([s, false]);
    for (const k of kids[at(s, s.cwd)] || []) out.push([k, true]);
    delete kids[at(s, s.cwd)];
  }
  for (const r in kids) for (const k of kids[r]) out.push([k, true]);   // root project has no session of its own
  return out;
}

  if (view && finePointer.matches) input.focus({preventScroll: true});   // a desktop: ready to type (a phone would pop its keyboard)
  refresh();
  emit("route", view);
}
function refresh() {
  clearTimeout(timer);
  timer = setTimeout(() => (view ? renderDetail(view) : renderList())
    .then(() => { if (!errSticky) $("err").classList.add("hidden"); })
    .catch(e => { $("live").classList.remove("on"); showError(e); }), 80);
}
let lastReport = 0;
let errSticky = false;   // an extension's error stays until tapped (a successful refresh hides the others)
function showError(e, sticky = false) {   // never fail silently: show it, and tell the daemon log (rate-limited)
  if (e && e.message && /fetch|network|load failed/i.test(e.message)) return;   // just offline
  errSticky = errSticky || sticky;
  $("err").textContent = "Display error: " + (e && e.message || e) + " (tap to retry)";
  $("err").classList.remove("hidden");
  if (Date.now() - lastReport > 30000) {
    lastReport = Date.now();
    api("/api/client-error", {message: String(e && e.message || e).slice(0, 500),
      stack: String(e && e.stack || "").slice(0, 2000), view: view || ""}).catch(() => {});
  }
}
addEventListener("error", ev => showError(ev.error || ev.message, !booted));   // before start-up: an extension's
$("err").onclick = () => { errSticky = false; $("err").classList.add("hidden"); refresh(); };
addEventListener("unhandledrejection", ev => showError(ev.reason));
$("back").onclick = () => go("#/");
addEventListener("hashchange", route);

// ---------------------------------------------------------------- extensions
// Run right after this script, before start-up: grovy's built-in extensions (extensions/*.js), then the user's
// ~/.config/grovy/custom.js (grovyd adds each as an inline <script>, allowed by its CSP hash like this one). They use
// only window.grovy below: everything else here may change. Named extensions (grovy.extension) start at start-up, so
// custom.js can turn a built-in one off first. A failing extension shows an error (kept until tapped) and never stops
// grovy itself. Guide and examples: examples/custom.js.
const ext = {menu: [], keys: [], on: {render: [], update: [], route: [], send: []}, named: [], off: new Set()};
let booted = false;
const FAILED = Symbol("failed");
// Turned off in ⋯ → Extensions (kept by grovyd for every device, sent with the page): skipped at start-up, like
// grovy.disable() in custom.js. savedOff follows later changes, which apply on the next reload.
const loadedOff = (() => {
  try { return new Set(JSON.parse(document.querySelector('meta[name="grovy-off"]').content)); } catch (e) { return new Set(); }
})();
let savedOff = new Set(loadedOff);
const extRuns = name => !ext.off.has(name) && !loadedOff.has(name);
function runExt(what, fn, ...args) {
  try { return fn(...args); }
  catch (e) { showError(new Error(`extension (${what}): ${e && e.message || e}`), true); return FAILED; }
}
function emit(name, ...args) { for (const fn of ext.on[name]) runExt(name, fn, ...args); }
function extend(node, e) {   // a message was drawn: extensions may add to it (it is drawn once, then kept)
  if (node && ext.on.render.length) { const copy = structuredClone(e); for (const fn of ext.on.render) runExt("render", fn, node, copy); }
  return node;
}
function extItems(where) {   // {section, node} for each extension ⋯ item that belongs here right now
  return ext.menu.filter(m => (m.where === where || m.where === "both") &&
                             (!m.when || runExt("menu " + m.label, m.when, cur ? structuredClone(cur) : null) === true)).map(m =>
    ({section: m.section, node:
      h("button", {class: "item", onclick: () => { closeSheet(); runExt("menu " + m.label, m.run, view); }}, m.label,
        m.sub ? h("div", {class: "sub"}, m.sub) : null)}));
}
// render {section, node} entries grouped under headers: the named sections first in order, then any others as they
// appear; a section with no items (after dropping null nodes) shows nothing. def is the section for items that name none.
function grouped(order, def, entries) {
  const items = entries.filter(e => e && e.node), sections = [...order];
  for (const e of items) { const s = e.section || def; if (!sections.includes(s)) sections.push(s); }
  const out = [];
  for (const s of sections) {
    const nodes = items.filter(e => (e.section || def) === s).map(e => e.node);
    if (nodes.length) out.push(h("div", {class: "sect" + (out.length ? "" : " first")}, s), ...nodes);
  }
  return out;
}
function sendHooks(text) {   // the text to send, or null when an extension stopped it (or failed: better not to send)
  for (const fn of ext.on.send) {
    const r = runExt("send", fn, text);
    if (r && typeof r.then === "function") {
      showError(new Error("extension (send): a send hook must answer at once (not async), so nothing was sent"), true);
      return null;
    }
    if (r === FAILED || r === false || (typeof r === "string" && !r.trim())) return null;
    if (typeof r === "string") text = r;
  }
  return text;
}
// Shortcuts. A combo is "Ctrl+K", "Alt+Shift+N", "Ctrl+?", "F2"... (Cmd counts as Ctrl). It needs Ctrl or Alt (except
// F-keys), so it can't steal plain typing, and can't be one of grovy's own (or the browser's reload / developer tools).
// With Alt alone (Option on a Mac, which turns Alt+R into "®"), letters and digits also match their physical key. Not
// with AltGr (Ctrl+Alt on Windows): that types characters such as "@", and those must stay typeable.
const KEY_NAMES = {enter: "Enter", esc: "Escape", escape: "Escape", tab: "Tab", space: "Space", backspace: "Backspace",
  delete: "Delete", del: "Delete", up: "ArrowUp", down: "ArrowDown", left: "ArrowLeft", right: "ArrowRight",
  arrowup: "ArrowUp", arrowdown: "ArrowDown", arrowleft: "ArrowLeft", arrowright: "ArrowRight", home: "Home", end: "End",
  pageup: "PageUp", pagedown: "PageDown", insert: "Insert"};
for (let i = 1; i <= 12; i++) KEY_NAMES["f" + i] = "F" + i;
const RESERVED = new Set(["Ctrl+Enter", "Alt+ArrowUp", "Alt+ArrowDown", "F5", "F12"]);
const ALNUM = /^[A-Za-z0-9]$/;
function comboKey(mods, key) { return [...["Ctrl", "Alt", "Shift"].filter(m => mods.includes(m)), key].join("+"); }
const keyName = k => k === " " ? "Space" : /^[a-z]$/.test(k) ? k.toUpperCase() : k;   // ASCII only: "ß" stays "ß"
const shiftCounts = key => key.length > 1 || ALNUM.test(key);   // a symbol already says Shift ("?" is Shift+/)
function combosOf(e) {
  if (typeof e.key !== "string" || !e.key || ["Control", "Alt", "Shift", "Meta", "AltGraph"].includes(e.key)) return [];
  const mods = shift => [e.ctrlKey || e.metaKey ? "Ctrl" : "", e.altKey ? "Alt" : "", shift ? "Shift" : ""];
  const out = [];
  const key = keyName(e.key);
  if (key !== "Dead") out.push(comboKey(mods(e.shiftKey && shiftCounts(key)), key));
  const phys = /^(?:Key|Digit)([A-Z0-9])$/.exec(e.code || "");
  const altGr = e.ctrlKey || (e.getModifierState && e.getModifierState("AltGraph"));
  if (phys && e.altKey && !e.metaKey && !altGr && !ALNUM.test(e.key)) out.push(comboKey(mods(e.shiftKey), phys[1]));
  return out;
}
function normCombo(c) {
  const s = String(c).trim(), plus = s.endsWith("++");
  const parts = (plus ? s.slice(0, -2) : s).split("+").map(p => p.trim());
  const raw = plus ? "+" : parts.pop();
  const bad = why => new Error(`grovy.key: "${c}" ${why} (e.g. "Ctrl+K", "Alt+Shift+N", "Ctrl+/", "F2")`);
  if (parts.some(p => !p)) throw bad("isn't a key combination");
  const mods = parts.map(p => ({ctrl: "Ctrl", control: "Ctrl", cmd: "Ctrl", command: "Ctrl", meta: "Ctrl", alt: "Alt",
                                option: "Alt", opt: "Alt", shift: "Shift"})[p.toLowerCase()]);
  if (!raw || mods.includes(undefined)) throw bad("isn't a key combination");
  const key = raw.length === 1 ? keyName(raw) : KEY_NAMES[raw.toLowerCase()];
  if (!key) throw bad(`has an unknown key "${raw}"`);
  if (mods.includes("Shift") && !shiftCounts(key))   // Shift changes the symbol itself
    throw bad(`uses Shift with a symbol: name the symbol it types instead (e.g. "Ctrl+?" rather than "Ctrl+Shift+/")`);
  const combo = comboKey(mods, key);
  if (!/^F\d+$/.test(key) && !mods.includes("Ctrl") && !mods.includes("Alt")) throw bad("needs Ctrl or Alt");
  if (RESERVED.has(combo)) throw bad("is kept for grovy or the browser");
  return combo;
}
const fnArg = (fn, what) => { if (typeof fn !== "function") throw new Error(what + " needs a function"); return fn; };
const SLOTS = {composer: "slot-composer"};
window.grovy = Object.freeze({
  version: 1,
  // building blocks: h(tag, attrs, ...children) makes DOM safely; md(text) renders markdown; api(path, body) calls grovyd
  h, md, api,
  ask: (msg, ok, opts) => ask(msg, ok, opts),   // -> Promise<boolean>
  say: msg => say(msg),
  sheet: (...kids) => openSheet(...kids), closeSheet,
  css(text) {   // styles of your own: after grovy's, before the user's custom.css (which must keep the last word)
    const el = h("style", {}, String(text)), user = $("custom-css");
    if (user) user.before(el); else document.head.append(el);
  },
  slot(name) {   // a place in the page to put your own things: "composer" (above the message box, below the replies)
    if (!SLOTS[name]) throw new Error(`grovy.slot: unknown slot "${name}" (${Object.keys(SLOTS).join(", ")})`);
    return $(SLOTS[name]);
  },
  get session() { return view; },                                    // the open session's name, or null on the home screen
  get state() { return cur ? structuredClone(cur) : null; },          // a copy of its state, as grovyd sent it
  draft(text) {                                                      // put text in the message box for the user to send
    if (!view) throw new Error("grovy.draft: no session is open");
    fillComposer(String(text));
  },
  async send(text) {   // send a message now: the send hooks apply, as for the Send button; false if one stopped it
    if (!view) throw new Error("grovy.send: no session is open");
    const t = sendHooks(String(text));
    if (t == null) return false;
    await api(`/api/sessions/${encodeURIComponent(view)}/prompts`, {text: t, force: false});
    refresh();
    return true;
  },
  widget(type, render) {   // a ```widget type Claude can use: render(spec, live) returns a node (or an array of them)
    if (!/^[a-z][a-z0-9-]{0,30}$/.test(type)) throw new Error(`grovy.widget: bad type name "${type}"`);
    fnArg(render, "grovy.widget");
    WIDGETS[type] = (spec, live) => render(spec, live);
    if (booted) { cache.clear(); refresh(); }   // registered later on: redraw the messages that use it
  },
  // a ⋯ menu item; where: "session", "home" or "both"; when(state): shown only when it returns true (state: the open
  // session's, or null on the home screen); section: a header to group it under in the session menu ("Conversation",
  // "Session", or any name of your own; the home menu is a flat list and ignores it)
  math(render) {   // draws the math in replies: render(tex, display) returns a node, or throws (the TeX then shows as written)
    MATH = fnArg(render, "grovy.math");
    if (booted) { cache.clear(); refresh(); }
  },
  menu(label, run, {where = "session", sub = "", section = "", when = null} = {}) {
    if (!["session", "home", "both"].includes(where)) throw new Error(`grovy.menu: where must be "session", "home" or "both"`);
    ext.menu.push({label: String(label), run: fnArg(run, "grovy.menu"), where, sub: String(sub), section: String(section),
                   when: when == null ? null : fnArg(when, "grovy.menu when")});
  },
  // right-click items for a node you drew (a mouse only): items() returns [{label, run, sub, danger, disabled}]
  contextMenu(node, items) {
    if (!(node instanceof Element)) throw new Error("grovy.contextMenu: node must be an element");
    const fn = fnArg(items, "grovy.contextMenu");
    node._ctx = () => { const r = runExt("contextMenu", fn); return Array.isArray(r) ? r.map(x => x && {
      label: String(x.label), sub: x.sub ? String(x.sub) : null, danger: !!x.danger, disabled: !!x.disabled,
      run: () => runExt("contextMenu " + x.label, fnArg(x.run, "grovy.contextMenu item"))}) : []; };
  },
  key(combo, run) {   // a keyboard shortcut (see combosOf above)
    ext.keys.push({combo: normCombo(combo), run: fnArg(run, "grovy.key")});
  },
  on(name, fn) {   // render(node, event) · update(state) · route(session) · send(text) -> text | false
    if (!ext.on[name]) throw new Error(`grovy.on: unknown event "${name}" (${Object.keys(ext.on).join(", ")})`);
    ext.on[name].push(fnArg(fn, "grovy.on"));
  },
  // a named extension: setup(grovy) runs at start-up unless grovy.disable(name) was called or it is off in
  // ⋯ → Extensions; about: one line for that list
  extension(name, setup, {about = ""} = {}) {
    if (booted) throw new Error("grovy.extension: only before start-up (from extensions/ or custom.js)");
    ext.named.push({name: String(name), setup: fnArg(setup, "grovy.extension"), about: String(about)});
  },
  disable(name) { ext.off.add(String(name)); },   // e.g. grovy.disable("context-bar"), from custom.js
  get extensions() { return ext.named.map(x => ({name: x.name, on: extRuns(x.name), about: x.about})); },
});

// ---------------------------------------------------------------- start-up
// Runs once the page is parsed, so after the extensions: what they add is there from the first paint.
let es = null;
function connect() {
  if (es) es.close();
  es = new EventSource("/api/events");
  es.onopen = () => { $("live").classList.add("on"); refresh(); };
  es.onmessage = ev => { try { const m = JSON.parse(ev.data); if (!m.session || !view || m.session === view) refresh(); refreshSide(); } catch (e) {} };
  es.onerror = () => $("live").classList.remove("on");
}
function wake() { if (!es || es.readyState === 2) connect(); refresh(); }   // phone woke up / tab restored
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") wake(); });
addEventListener("pageshow", wake);
addEventListener("focus", wake);
addEventListener("online", connect);
setInterval(() => { if (document.visibilityState === "visible") { refresh(); refreshSide(); } }, 30000);
// Backup for mobile browsers that silently drop the event stream: poll while Claude is busy.
setInterval(() => {
  if (document.visibilityState === "visible" && view && cur && /working|starting|needs_input/.test(cur.state)) refresh();
}, 5000);
document.addEventListener("DOMContentLoaded", () => {
  for (const x of ext.named) if (extRuns(x.name)) runExt("extension " + x.name, x.setup, window.grovy);
  booted = true; route(); connect();
});
</script>
</body>
