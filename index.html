<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
<title>grovy</title>
<style>
:root { --bg:#f7f6f3; --fg:#1d1d1b; --mut:#77756e; --faint:#a9a69e; --card:#fff; --line:#e4e2dc;
  --acc:#c96442; --user:#dfe8fb; --code:#efede7; --ok:#2f8a4c; --warn:#c27c0e; --bad:#c2402f; --busy:#3a6fd8; }
@media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ebe9e4; --mut:#9c998f; --faint:#64625c;
  --card:#21211f; --line:#33322f; --acc:#e08a67; --user:#25365c; --code:#252523; --ok:#5cc47e; --warn:#f0a63a;
  --bad:#f0705f; --busy:#7aa2ff; } }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; background:var(--bg); color:var(--fg);
  font:16px/1.5 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
body { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
button { font:inherit; color:inherit; cursor:pointer; }
.hidden { display:none !important; }

/* header */
header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:8px;
  padding:8px 12px; padding-top:calc(8px + env(safe-area-inset-top)); background:var(--bg);
  border-bottom:1px solid var(--line); min-height:56px; }
#back { border:0; background:none; font-size:28px; line-height:1; padding:4px 10px 6px 2px; min-height:44px; }
header h1 { font-size:18px; margin:0; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pill { display:inline-flex; align-items:center; gap:7px; font-size:14px; font-weight:600; padding:5px 11px;
  border-radius:99px; background:var(--card); border:1px solid var(--line); white-space:nowrap; }
header { flex-wrap:wrap; }
/* context bar: a thin full-width line along the header's bottom edge; its tap area is taller than it looks */
#meta { flex-basis:100%; align-self:stretch; margin:0 -12px -8px; padding:8px 0 0; border:0; background:none;
  cursor:pointer; display:block; }
#meta i { display:block; height:3px; background:var(--line); }
#meta b { display:block; height:100%; background:var(--ok); transition:width .4s ease; }
#meta.warn b { background:var(--warn); } #meta.bad b { background:var(--bad); }
.kv2 { display:flex; justify-content:space-between; gap:12px; padding:11px 2px; border-bottom:1px solid var(--line); }
.kv2 span:first-child { color:var(--mut); }
#live { font-size:12px; font-weight:600; color:var(--warn); white-space:nowrap; flex:none; }
#live.on { display:none; }

/* state dots */
.dot { width:10px; height:10px; border-radius:50%; flex:none; background:var(--faint); }
.dot.idle { background:var(--ok); } .dot.error { background:var(--bad); }
.dot.working, .dot.starting { background:var(--busy); animation:breathe 2s ease-in-out infinite; }
.dot.needs_input { background:var(--warn); animation:breathe .9s ease-in-out infinite; }
.dot.unknown { background:var(--warn); } .dot.exited { background:var(--faint); }
.dot.stalled { background:var(--faint); animation:none; }
@keyframes breathe { 0%,100% { transform:scale(1); opacity:1 } 50% { transform:scale(.6); opacity:.45 } }

/* session list */
main { flex:1; width:100%; max-width:760px; margin:0 auto; padding:6px 14px 12px; }
.sess { display:flex; gap:12px; align-items:flex-start; width:100%; text-align:left; border:0; background:none;
  padding:14px 4px; border-bottom:1px solid var(--line); }
.sess .dot { margin-top:7px; }
.sess .body { flex:1; min-width:0; }
.sess .top { display:flex; gap:8px; align-items:baseline; }
.sess .name { font-weight:650; font-size:17px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
.sess .when { font-size:13px; color:var(--mut); flex:none; }
.sess .sub { font-size:13px; color:var(--mut); }
.sess .prev { font-size:15px; margin-top:2px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2;
  -webkit-box-orient:vertical; overflow-wrap:anywhere; }
.sess .rm { align-self:center; flex:none; font-size:13px; font-weight:600; color:var(--bad); border:1px solid var(--line);
  border-radius:99px; padding:6px 12px; background:var(--card); }
.sess .badge { font-size:12px; font-weight:700; color:#fff; background:var(--warn); border-radius:99px; padding:1px 8px; }
.empty { text-align:center; color:var(--mut); padding:48px 10px; }

/* conversation */
.u { margin:18px 0 6px auto; max-width:86%; width:fit-content; background:var(--user); padding:9px 13px;
  border-radius:18px 18px 4px 18px; white-space:pre-wrap; overflow-wrap:anywhere; }
.u .st { display:block; font-size:12px; color:var(--mut); margin-top:3px; text-align:right; }
.u .st.bad { color:var(--bad); } .u .st.warn { color:var(--warn); }
.u.pending { opacity:.75; }
.u button.link { border:0; background:none; color:var(--acc); padding:0 0 0 6px; font-size:12px; }
.a { margin:6px 0 4px; overflow-wrap:anywhere; }
.a.collapsed .md { max-height:22em; overflow:hidden; -webkit-mask-image:linear-gradient(#000 70%, transparent); }
.agent { border:1px solid var(--line); border-left:3px solid var(--mut); border-radius:10px; padding:8px 12px; margin:14px 0; }
.agent .ah { font-size:13px; font-weight:650; color:var(--mut); margin-bottom:4px; }
.agent.collapsed .a { max-height:7.5em; overflow:hidden; -webkit-mask-image:linear-gradient(#000 40%, transparent); }
.more { border:0; background:none; color:var(--acc); font-weight:600; padding:6px 0; min-height:36px; }
.sys { text-align:center; font-size:12.5px; color:var(--mut); margin:10px 0; }
.sys span { padding:0 8px; }
.time { text-align:center; font-size:12px; color:var(--faint); margin:22px 0 0; }
.err { border:1px solid var(--bad); color:var(--bad); border-radius:12px; padding:10px 12px; margin:10px 0;
  white-space:pre-wrap; }

/* markdown */
.md > :first-child { margin-top:0 } .md > :last-child { margin-bottom:0 }
.md p { margin:0 0 .7em; }
.md h1, .md h2, .md h3, .md h4 { margin:1.1em 0 .4em; line-height:1.3; }
.md h1 { font-size:1.25em } .md h2 { font-size:1.15em } .md h3, .md h4 { font-size:1.03em }
.md ul, .md ol { margin:0 0 .7em; padding-left:1.4em; } .md li { margin:.2em 0; }
.md li > ul, .md li > ol { margin:.2em 0 0; }
.md blockquote { margin:0 0 .7em; padding:2px 0 2px 12px; border-left:3px solid var(--line); color:var(--mut); }
.md hr { border:0; border-top:1px solid var(--line); margin:1em 0; }
.md a { color:var(--acc); }
.md code { font:.88em/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background:var(--code);
  padding:.1em .35em; border-radius:5px; }
.cb { position:relative; margin:0 0 .8em; }
.cb pre { margin:0; padding:12px; padding-right:52px; background:var(--code); border-radius:10px; overflow-x:auto;
  font:13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
.cb pre code { background:none; padding:0; font-size:inherit; }
.cb .copy { position:absolute; top:6px; right:6px; border:1px solid var(--line); background:var(--card);
  border-radius:8px; font-size:12px; padding:5px 9px; min-height:32px; }
.tw { overflow-x:auto; margin:0 0 .8em; }
.tw table { border-collapse:collapse; font-size:14px; }
.tw th, .tw td { border-bottom:1px solid var(--line); padding:6px 10px 6px 0; text-align:left; vertical-align:top; }
.rc { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:0 0 8px; }
.rc .t { font-weight:650; margin-bottom:4px; }
.rc .kv { font-size:14.5px; margin:3px 0; } .rc .k { color:var(--mut); }

/* typing indicator (lives outside the re-rendered list so its animation never restarts) */
#typing { max-width:760px; margin:0 auto; width:100%; padding:2px 14px 10px; display:flex; align-items:center; gap:10px; }
.dots { display:inline-flex; gap:5px; padding:11px 14px; background:var(--card); border:1px solid var(--line);
  border-radius:18px 18px 18px 4px; }
.dots i { width:7px; height:7px; border-radius:50%; background:var(--busy); animation:hop 1.3s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay:.16s } .dots i:nth-child(3) { animation-delay:.32s }
@keyframes hop { 0%,60%,100% { transform:translateY(0); opacity:.5 } 30% { transform:translateY(-5px); opacity:1 } }
#typing.stalled .dots i { background:var(--faint); animation-duration:3.2s; }
.tool { font:12.5px ui-monospace, SFMono-Regular, Menlo, monospace; background:var(--code); border-radius:7px;
  padding:3px 8px; max-width:45vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tool.fade { animation:fadein .45s ease-out; }
@keyframes fadein { from { opacity:0; transform:translateY(3px) } to { opacity:1; transform:none } }
.elapsed { font-size:13px; color:var(--mut); font-variant-numeric:tabular-nums; }

/* permission card */
.perm { border:2px solid var(--warn); border-radius:14px; padding:12px; margin:14px 0; background:var(--card);
  animation:slideup .35s ease-out; }
@keyframes slideup { from { opacity:0; transform:translateY(16px) } to { opacity:1; transform:none } }
.perm .h { font-weight:650; margin-bottom:6px; } .perm .note { font-size:13px; color:var(--mut); margin-top:6px; }
.perm pre { margin:6px 0 0; padding:10px; background:var(--code); border-radius:8px; white-space:pre-wrap;
  overflow-wrap:anywhere; font:13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; max-height:45vh; overflow:auto; }
.row { display:flex; gap:10px; margin-top:12px; }
.btn { flex:1; min-height:48px; border-radius:12px; border:1px solid var(--line); background:var(--card); font-weight:650; }
.btn.allow { background:var(--ok); border-color:var(--ok); color:#fff; }
.btn.deny { color:var(--bad); border-color:var(--bad); }
.btn:disabled { opacity:.45; }

#err { position:fixed; left:12px; right:12px; top:calc(64px + env(safe-area-inset-top)); z-index:30; background:var(--bad);
  color:#fff; border-radius:10px; padding:10px 12px; font-size:14px; }
/* bottom sheet (switcher, menu, new session, search) */
#sheet { position:fixed; inset:0; z-index:40; display:flex; align-items:flex-end; background:rgba(0,0,0,.35);
  animation:fadebg .2s ease-out; }
#sheet .panel { width:100%; max-width:760px; margin:0 auto; max-height:85vh; overflow-y:auto; background:var(--bg);
  border-radius:18px 18px 0 0; padding:8px 16px calc(16px + env(safe-area-inset-bottom)); animation:slideup .25s ease-out; }
#sheet .grab { width:40px; height:4px; border-radius:2px; background:var(--line); margin:4px auto 12px; }
#sheet h2 { font-size:17px; margin:4px 0 12px; }
@keyframes fadebg { from { background:rgba(0,0,0,0) } }
.item { display:flex; align-items:center; gap:12px; width:100%; text-align:left; border:0; background:none;
  padding:12px 4px; min-height:52px; border-bottom:1px solid var(--line); font-size:16px; }
.item.danger { color:var(--bad); } .item .sub { font-size:13px; color:var(--mut); }
.item.cur { font-weight:700; }
.field { display:block; width:100%; font:inherit; font-size:16px; padding:11px 14px; border-radius:12px;
  border:1px solid var(--line); background:var(--card); color:var(--fg); margin:0 0 12px; }
.lbl { font-size:13px; color:var(--mut); margin:0 0 6px; }
.folders { max-height:38vh; overflow-y:auto; border:1px solid var(--line); border-radius:12px; margin-bottom:12px; }
.folders .item { padding:10px 12px; min-height:48px; }
.folders .item.sel { background:color-mix(in srgb, var(--busy) 12%, var(--bg)); font-weight:650; }
.toggle { display:flex; align-items:center; gap:10px; margin:0 0 14px; font-size:15px; }
.toggle input { width:22px; height:22px; }
.hit { border:1px solid var(--line); background:var(--card); border-radius:12px; padding:10px 12px; margin:0 0 8px;
  width:100%; text-align:left; }
.hit .w { font-size:12px; color:var(--mut); } .hit .s { overflow:hidden; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }
mark { background:color-mix(in srgb, var(--warn) 35%, transparent); color:inherit; border-radius:3px; }
#title.tap { cursor:pointer; } #title.tap::after { content:" ▾"; font-size:13px; color:var(--mut); }
.hbtn { border:0; background:none; font-size:24px; line-height:1; min-width:44px; min-height:44px; padding:0 6px; color:var(--fg); }
.earlier { display:block; margin:6px auto 10px; border:1px solid var(--line); background:var(--card); border-radius:99px;
  padding:6px 16px; font-size:14px; min-height:36px; }
#quick { display:flex; gap:8px; margin:0 0 8px; flex-wrap:wrap; }
#quick:empty { display:none; }
.chip { border:1px solid var(--line); background:var(--card); border-radius:99px; padding:8px 16px; min-height:40px; font-weight:600; }
.resume { width:100%; min-height:48px; border-radius:12px; border:0; background:var(--acc); color:#fff; font-weight:650; }

/* readable tool input on permission cards */
.diff { margin:6px 0 0; border-radius:8px; overflow:hidden; font:13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
.diff div { white-space:pre-wrap; overflow-wrap:anywhere; padding:0 8px; }
.diff .del { background:color-mix(in srgb, var(--bad) 16%, transparent); }
.diff .add { background:color-mix(in srgb, var(--ok) 18%, transparent); }
.diff .del::before { content:"− "; color:var(--bad); } .diff .add::before { content:"+ "; color:var(--ok); }
.path { font:13px ui-monospace, SFMono-Regular, Menlo, monospace; color:var(--mut); overflow-wrap:anywhere; margin-top:2px; }

.warnline { color:var(--warn); font-size:14px; margin:0 0 12px; }
.errline { color:var(--bad); font-size:14px; font-weight:600; margin:6px 0 10px; }
/* question card */
.q { border:2px solid var(--busy); }
.q .qh { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--busy); margin-top:4px; }
.q .qt { font-weight:650; margin:2px 0 8px; }
.opt { display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--bg); border-radius:12px;
  padding:10px 12px; margin:0 0 8px; min-height:48px; }
.opt .d { display:block; font-size:13px; color:var(--mut); margin-top:2px; }
.opt.sel { border-color:var(--busy); background:color-mix(in srgb, var(--busy) 12%, var(--bg)); }
.opt.sel::before { content:"✓ "; color:var(--busy); font-weight:700; }
.q textarea { width:100%; min-height:44px; border-radius:12px; margin-bottom:4px; }
.q + .q, .qs + .qs { margin-top:14px; }

/* composer */
#composer { position:sticky; bottom:0; z-index:4; background:var(--bg); border-top:1px solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom)); }
#composer .inner { max-width:760px; margin:0 auto; }
#hint { font-size:12.5px; color:var(--mut); margin:0 4px 6px; }
#hint:empty { display:none; }
.cr { display:flex; gap:8px; align-items:flex-end; }
textarea { flex:1; font:inherit; font-size:16px; padding:11px 14px; border-radius:22px; border:1px solid var(--line);
  background:var(--card); color:var(--fg); min-height:46px; max-height:40vh; resize:none; outline:none; }
textarea:focus { border-color:var(--mut); }
#send { width:46px; height:46px; border-radius:50%; border:0; background:var(--acc); color:#fff; flex:none;
  display:grid; place-items:center; }
#send:disabled { opacity:.35; }
#stop { width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:var(--card); flex:none;
  display:grid; place-items:center; color:var(--bad); }
#stop i { width:14px; height:14px; border-radius:3px; background:currentColor; }
#picker { display:flex; flex-direction:column; gap:2px; margin:0 0 8px; max-height:40vh; overflow-y:auto; }
#picker:empty { display:none; }
.cmd { text-align:left; border:0; background:var(--card); border-radius:10px; padding:8px 12px; min-height:44px; }
.cmd b { font:600 14px ui-monospace, SFMono-Regular, Menlo, monospace; } .cmd span { display:block; font-size:12.5px; color:var(--mut); }
#send svg { width:20px; height:20px; }
/* pages: Claude-made HTML, shown full-screen in a sandboxed frame */
#viewer { position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; background:var(--bg); }
#viewer .vh { display:flex; align-items:center; gap:10px; padding:8px 12px; padding-top:calc(8px + env(safe-area-inset-top));
  border-bottom:1px solid var(--line); min-height:52px; }
#viewer .vh b { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#vclose { border:0; background:none; font-size:20px; min-width:44px; min-height:44px; margin-left:-8px; }
#vver { font-size:13px; color:var(--mut); } #vtab { font-size:14px; color:var(--acc); white-space:nowrap; }
#vshare { border:0; background:none; font-size:14px; color:var(--acc); padding:8px 2px; white-space:nowrap; }
#vshare.on { color:var(--ok); font-weight:650; }
.link { font:13px/1.4 ui-monospace, monospace; background:var(--code); border-radius:8px; padding:10px; overflow-wrap:anywhere; margin:0 0 10px; }
#vframe { flex:1; width:100%; border:0; background:#fff; }
.pagecard { display:flex; align-items:center; gap:12px; margin:6px 0 12px; padding:12px; border:1px solid var(--line);
  border-radius:12px; background:var(--card); text-align:left; width:100%; }
.pagecard .pi { width:36px; height:36px; border-radius:8px; background:var(--code); display:grid; place-items:center; flex:none; color:var(--mut); }
.pagecard b { display:block; } .pagecard span { font-size:13px; color:var(--mut); }
.pagecard .go { margin-left:auto; color:var(--acc); font-weight:650; white-space:nowrap; }
.pagecard.gone { opacity:.6; }
.pagecard .rm { margin-left:auto; flex:none; font-size:13px; font-weight:600; color:var(--bad); border:1px solid var(--line);
  border-radius:99px; padding:6px 12px; }
.sech { display:flex; align-items:baseline; justify-content:space-between; margin:22px 2px 2px; font-size:13px; font-weight:650;
  color:var(--mut); text-transform:uppercase; letter-spacing:.04em; }
/* widgets (```widget blocks, drawn by grovy) */
:root { --c1:#3a6fd8; --c2:#c96442; --c3:#2f8a4c; --c4:#8a5cc7; --c5:#c27c0e; --c6:#2a9aa8; }
@media (prefers-color-scheme: dark) { :root { --c1:#7aa2ff; --c2:#e08a67; --c3:#5cc47e; --c4:#b48cf0; --c5:#f0a63a; --c6:#5cc8d4; } }
.c1 { --c:var(--c1) } .c2 { --c:var(--c2) } .c3 { --c:var(--c3) } .c4 { --c:var(--c4) } .c5 { --c:var(--c5) } .c6 { --c:var(--c6) }
.wg { margin:.4em 0 .9em; padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--card); }
.wg.werr { color:var(--bad); font-size:14px; border-style:dashed; }
.wt { font-weight:650; margin:0 0 10px; }
.wn { font-size:13px; color:var(--mut); }
.lg { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:13px; color:var(--mut); margin:0 0 8px; }
.lg span { display:inline-flex; align-items:center; gap:6px; } .lg i { width:10px; height:10px; border-radius:3px; background:var(--c); flex:none; }
.lg.col { flex-direction:column; gap:6px; color:var(--fg); font-size:14px; } .lg em { font-style:normal; color:var(--mut); margin-left:auto; padding-left:10px; }
.bars { display:flex; flex-direction:column; gap:9px; }
.bl { font-size:14px; margin-bottom:2px; overflow-wrap:anywhere; }
.bv { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--mut); }
.bv b { display:block; height:12px; min-width:2px; border-radius:3px; background:var(--c); flex:none; max-width:calc(100% - 70px); }
.bv b.neg { opacity:.55; }
.pie { display:flex; align-items:center; gap:16px; flex-wrap:wrap; } .pie svg { width:120px; height:120px; flex:none; }
.pie path { fill:var(--c); } .pie .ring { stroke:var(--c); } .pie .lg { flex:1; min-width:150px; margin:0; }
svg.line { width:100%; height:auto; display:block; } svg text { fill:var(--mut); font-size:11px; font-family:inherit; }
svg.line .grid { stroke:var(--line); } svg.line .ln { fill:none; stroke:var(--c); stroke-width:2.2; stroke-linejoin:round; }
svg.line .dot { fill:var(--card); stroke:var(--c); stroke-width:2; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:8px; }
.tile { padding:10px 12px; border-radius:10px; background:var(--bg); }
.tv { font-size:22px; font-weight:700; line-height:1.2; overflow-wrap:anywhere; } .tl { font-size:14px; color:var(--mut); }
.tv.ok { color:var(--ok) } .tv.warn { color:var(--warn) } .tv.bad { color:var(--bad) }
.pg { margin:0 0 10px; } .pg:last-child { margin:0; }
.pgh { display:flex; justify-content:space-between; gap:10px; font-size:14px; margin-bottom:4px; }
.pg i { display:block; height:8px; border-radius:4px; background:var(--line); overflow:hidden; }
.pg b { display:block; height:100%; background:var(--busy); } .pg b.ok { background:var(--ok) } .pg b.warn { background:var(--warn) } .pg b.bad { background:var(--bad) }

// ---------------------------------------------------------------- markdown (subset, DOM-built, no HTML)
function inline(text) {

const WIDGETS = {
  chart(s) {
    const labels = warr(s.labels, "labels", 60).map(l => wtext(l, 60));

  const valid = () => { go_.disabled = !(picked && /^[A-Za-z0-9][A-Za-z0-9_-]{0,31}$/.test(name.value) && !taken.has(name.value)); };
  const loadConvs = async () => {
    convs.replaceChildren(h("div", {class: "sub", style: "color:var(--mut);font-size:13px;margin:0 0 10px"}, "Loading conversations…"));
    let cs = [];
    try { cs = (await api("/api/conversations?path=" + encodeURIComponent(picked))).conversations; } catch (e) { cs = []; }
    convs.replaceChildren(...(cs.length ? [h("div", {class: "lbl"}, "Continue a conversation"),
      h("div", {class: "folders"}, cs.map(c => h("button", {class: "item", onclick: () => preview(c, keep())},
        h("div", {style: "min-width:0;flex:1"}, c.title || (c.first || "").slice(0, 80),
          h("div", {class: "sub"}, `${c.messages} message${c.messages === 1 ? "" : "s"} · ${ago(c.mtime) || "now"}`,
            c.open_in ? " · open " + (c.open_in === "terminal" ? "in a terminal" : "in " + c.open_in.slice(4)) : "")))))] : []));
  };
  const draw = () => list.replaceChildren(...folders.filter(f => f.toLowerCase().includes(filter.value.toLowerCase())).map(f =>
    h("button", {class: "item" + (f === picked ? " sel" : ""), onclick: () => {
      picked = f; if (!name.value || name.dataset.auto) { name.value = unique(base(f)); name.dataset.auto = "1"; }
      draw(); valid(); loadConvs(); }},
      h("div", {}, base(f), h("div", {class: "sub"}, f)))));
  name.oninput = () => { delete name.dataset.auto; valid(); };
  filter.oninput = draw;
  go_.onclick = async () => {
    go_.disabled = true; note.textContent = "Starting Claude…";
    try { await api("/api/sessions", {name: name.value, path: picked, ask: ask.checked}); closeSheet(); go("#/s/" + name.value); }
    catch (e) { note.className = "errline"; note.textContent = e.message; valid(); }
  };
  draw(); valid(); if (picked) loadConvs();
  openSheet(h("h2", {}, "New session"), h("div", {class: "lbl"}, "Folder (ones Claude already trusts)"), filter, list, convs,
    h("div", {class: "lbl"}, "Name"), name,
    h("label", {class: "toggle"}, ask, "Ask before running tools"), note, h("div", {class: "row"}, go_));

  // ---- preview of one past conversation, then continue / fork / jump
  function preview(c, st) {
    const nm = h("input", {class: "field", autocapitalize: "off", autocorrect: "off"});
    nm.value = st.auto || !st.name ? unique(c.title || base(st.picked)) : st.name;
    const ask2 = h("input", {type: "checkbox"}); ask2.checked = st.ask;
    const msg = h("div", {class: "note"});
    const start = async fork => {
      const fail = t => { msg.className = "errline"; msg.textContent = t; };
      if (!/^[A-Za-z0-9][A-Za-z0-9_-]{0,31}$/.test(nm.value)) return fail("Name: letters, digits, - and _ only.");
      if (taken.has(nm.value)) return fail(`A session named "${nm.value}" already exists: pick another name.`);
      msg.className = "note"; msg.textContent = fork ? "Forking…" : "Starting Claude…";
      try { await api("/api/sessions", {name: nm.value, path: st.picked, ask: ask2.checked, resume: c.id, fork}); closeSheet(); go("#/s/" + nm.value); }
      catch (e) { fail(e.message); }
    };
    const inCcs = c.open_in && c.open_in.startsWith("grovy:"), inTerm = c.open_in === "terminal";
    const actions = inCcs
      ? [h("button", {class: "btn allow", onclick: () => { closeSheet(); go("#/s/" + c.open_in.slice(4)); }}, "Open session " + c.open_in.slice(4))]
      : inTerm ? [h("button", {class: "btn allow", onclick: () => start(true)}, "Fork a copy")]
      : [h("button", {class: "btn", onclick: () => start(true)}, "Fork a copy"), h("button", {class: "btn allow", onclick: () => start(false)}, "Continue here")];
    openSheet(
      h("button", {class: "more", onclick: () => newSession(st)}, "‹ Back"),
      h("h2", {}, c.title || "Untitled conversation"),
      h("div", {class: "sub", style: "color:var(--mut);font-size:13px;margin:-6px 0 12px"},
        `${base(st.picked)} · ${c.messages} message${c.messages === 1 ? "" : "s"} · last active ${ago(c.mtime) || "now"}`),
      inCcs ? h("div", {class: "warnline"}, "Already open in grovy session " + c.open_in.slice(4) + ".")
        : inTerm ? h("div", {class: "warnline"}, "Open in another terminal right now. A fork continues from here as a copy; the original stays untouched.") : null,
      c.first ? h("div", {class: "lbl"}, "First message") : null, c.first ? h("div", {class: "u", style: "margin:0 0 12px auto"}, c.first) : null,
      c.last ? h("div", {class: "lbl"}, "Claude's last reply") : null,
      c.last ? h("div", {class: "a", style: "max-height:30vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px"}, md(c.last)) : null,
      ...(inCcs ? [] : [h("div", {class: "lbl"}, "Session name"), nm, h("label", {class: "toggle"}, ask2, "Ask before running tools")]),
      msg, h("div", {class: "row"}, ...actions));
  }
}
$("add").onclick = newSession;

// ---------------------------------------------------------------- routing + live updates
function go(hash) { location.hash = hash; }
function route() {
  const m = location.hash.match(/^#\/s\/([A-Za-z0-9_-]+)$/);
  view = m ? m[1] : null; lastEventId = 0; cur = null; first = true; lastTool = ""; cache.clear();
  older = []; noMore = false; closeSheet(); $("quick").replaceChildren();
  $("add").classList.toggle("hidden", !!view); $("menu").classList.toggle("hidden", !view);
  $("title").classList.toggle("tap", !!view); $("resume").classList.add("hidden"); $("meta").classList.add("hidden");
  $("back").classList.toggle("hidden", !view);
  $("pill").classList.toggle("hidden", !view);
  $("composer").classList.toggle("hidden", !view);
  $("typing").classList.add("hidden");
  $("title").textContent = view || "Sessions";
  main.replaceChildren();
  $("picker").replaceChildren(); commands = [];
  if (view) { try { input.value = localStorage.getItem(draftKey()) || ""; } catch (e) { input.value = ""; } autosize(); loadCommands(); }
  refresh();
}
function refresh() {
  clearTimeout(timer);
  timer = setTimeout(() => (view ? renderDetail(view) : renderList())
    .then(() => $("err").classList.add("hidden"))
    .catch(e => { $("live").classList.remove("on"); showError(e); }), 80);
}
let lastReport = 0;
function showError(e) {   // never fail silently: show it, and tell the daemon log (rate-limited)
  if (e && e.message && /fetch|network|load failed/i.test(e.message)) return;   // just offline
  $("err").textContent = "Display error: " + (e && e.message || e) + " (tap to retry)";
  $("err").classList.remove("hidden");
  if (Date.now() - lastReport > 30000) {
    lastReport = Date.now();
    api("/api/client-error", {message: String(e && e.message || e).slice(0, 500),
      stack: String(e && e.stack || "").slice(0, 2000), view: view || ""}).catch(() => {});
  }
}
addEventListener("error", ev => showError(ev.error || ev.message));
$("err").onclick = () => { $("err").classList.add("hidden"); refresh(); };
addEventListener("unhandledrejection", ev => showError(ev.reason));
$("back").onclick = () => go("#/");
addEventListener("hashchange", route);

// ---------------------------------------------------------------- pages
function pageCard(id, title, sub, deletable = false) {
  const gone = !pages[id];
  return h("button", {class: "pagecard" + (gone ? " gone" : ""), onclick: () => gone ? null : openPage(id)},
    h("span", {class: "pi"}, "▤"), h("div", {}, h("b", {}, title || "page"),
      h("span", {}, gone ? "deleted" : sub + (pages[id].share ? " · shared" : ""))),
    gone ? null : deletable
      ? h("span", {class: "rm", role: "button", "aria-label": "Delete " + (title || "page"),
          onclick: ev => { ev.stopPropagation(); deletePage(id, title); }}, "Delete")
      : h("span", {class: "go"}, "Open"));
}
async function deletePage(id, title) {
  if (!await ask(`Delete the page "${title || "page"}"? Its link stops working.`, "Delete", {danger: true})) return;
  try { await api(`/api/pages/${id}/delete`, {}); } catch (e) { return say(e.message); }
  refresh();
}
function openPage(id) {
  const p = pages[id]; if (!p) return;
  closeSheet();
  const src = "/p/" + id + "?v=" + p.version;
  if (!viewing) history.pushState({viewer: 1}, "");   // the phone's back button closes the viewer
  viewing = {id, version: p.version, share: p.share};
  $("vtitle").textContent = p.title; $("vver").textContent = "v" + p.version;
  $("vshare").textContent = p.share ? "Shared" : "Share"; $("vshare").classList.toggle("on", !!p.share);
  $("vtab").href = src;
  if ($("vframe").getAttribute("src") !== src) $("vframe").src = src;
  $("viewer").classList.remove("hidden");
}
const shareUrl = token => location.origin + "/s/" + token;
async function shareSheet(id) {
  const p = pages[id]; if (!p) return;
  const set = async on => {
    try { const r = await api(`/api/pages/${id}/share`, {shared: on}); pages[id] = {...pages[id], share: r.page.share}; }
    catch (e) { return say(e.message); }
    viewing && openPage(viewing.id); shareSheet(id);
  };
  if (!p.share) return openSheet(h("h2", {}, "Share on your network"),
    h("p", {style: "margin:0 0 14px"}, "Anyone who can reach this computer and has the link can view this page, without the grovy token. They see only this page, still sandboxed. You can stop sharing at any time."),
    h("div", {style: "display:flex;gap:10px"}, h("button", {class: "btn", onclick: closeSheet}, "Cancel"),
      h("button", {class: "btn allow", onclick: () => set(true)}, "Share")));
  const url = shareUrl(p.share), copy = h("button", {class: "btn"}, "Copy link");
  copy.onclick = () => copyText(url, copy);
  openSheet(h("h2", {}, "Shared on your network"), h("div", {class: "link"}, url),
    h("p", {class: "wn", style: "margin:0 0 14px"}, "Updates to the page show at the same link. Stopping sharing breaks this link; sharing again makes a new one."),
    h("div", {style: "display:flex;gap:10px"}, copy, h("button", {class: "btn deny", onclick: () => set(false)}, "Stop sharing")));
}
$("vshare").onclick = () => viewing && shareSheet(viewing.id);
function closeViewer() {
  viewing = null; $("viewer").classList.add("hidden"); $("vframe").removeAttribute("src");
}
$("vclose").onclick = () => history.state && history.state.viewer ? history.back() : closeViewer();
addEventListener("popstate", () => { if (viewing) closeViewer(); });
addEventListener("message", e => {   // only the open page's frame may propose a message, and only as a draft
  if (!viewing || e.source !== $("vframe").contentWindow) return;
  const m = e.data;
  if (!m || m.grovy !== "send" || typeof m.text !== "string" || !m.text.trim()) return;
  const text = m.text.slice(0, 20000);
  $("vclose").click();
  setTimeout(() => fillComposer(text), 50);
});
async function pagesSheet(session) {
  let list = [];
  try { list = (await api(`/api/sessions/${encodeURIComponent(session)}/pages`)).pages; } catch (e) { return say(e.message); }
  openSheet(h("h2", {}, "Pages"), list.map(p => pageCard(p.id, p.title, `v${p.version} · ${ago(p.updated)}`, true)),
    list.length ? null : h("div", {class: "sys"}, "No pages."));
}

let es = null;
function connect() {
  if (es) es.close();
  es = new EventSource("/api/events");
  es.onopen = () => { $("live").classList.add("on"); refresh(); };
  es.onmessage = ev => { try { const m = JSON.parse(ev.data); if (!m.session || !view || m.session === view) refresh(); } catch (e) {} };
  es.onerror = () => $("live").classList.remove("on");
}
function wake() { if (!es || es.readyState === 2) connect(); refresh(); }   // phone woke up / tab restored
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") wake(); });
addEventListener("pageshow", wake);
addEventListener("focus", wake);
addEventListener("online", connect);
setInterval(() => { if (document.visibilityState === "visible") refresh(); }, 30000);
// Backup for mobile browsers that silently drop the event stream: poll while Claude is busy.
setInterval(() => {
  if (document.visibilityState === "visible" && view && cur && /working|starting|needs_input/.test(cur.state)) refresh();
}, 5000);
route(); connect();
</script>
</body>
